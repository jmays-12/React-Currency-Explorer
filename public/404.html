<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const repo = "/React-Currency-Explorer";

      if (path.startsWith(repo)) {
        const route = path.slice(repo.length);
        window.location.replace(
          repo + "/?redirect=" + encodeURIComponent(route + window.location.search + window.location.hash)
        );
      }
    </script>
  </head>
  <body></body>
</html>
